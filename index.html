<!doctype html><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'>
<title>小狗日记</title>
<link rel=manifest href=./manifest.json>
<link rel=apple-touch-icon href=./apple-touch-icon.png>
<meta name=apple-mobile-web-app-capable content=yes>
<meta name=theme-color content=#e9f2ff>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:36px 18px 70px;font:16px/1.85 -apple-system,sans-serif;color:#1b2b4a;background:#e9f2ff;background-image:radial-gradient(700px 440px at 8% -10%,#cfe3ff 0%,rgba(207,227,255,0) 65%),radial-gradient(620px 420px at 98% 4%,#e2eaff 0%,rgba(226,234,255,0) 62%),radial-gradient(880px 560px at 50% 112%,#dbe9ff 0%,rgba(219,233,255,0) 68%),linear-gradient(170deg,#f4f9ff 0%,#e3efff 55%,#d6e5ff 100%);background-attachment:fixed}
h1{font-size:13px;letter-spacing:5px;color:#5b7bb0;font-weight:600;margin:0 0 24px;text-align:center}
#a>div{position:relative;background:rgba(255,255,255,.48);border:1px solid rgba(255,255,255,.9);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border-radius:22px;padding:16px 18px;margin-bottom:12px;box-shadow:0 10px 30px rgba(43,84,150,.13),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -10px 20px rgba(255,255,255,.35);overflow:hidden}
#a>div>div:first-child{color:#7a93bf;font-size:12px;margin-bottom:7px;letter-spacing:.5px}
#n{display:none;text-align:center;margin:0 0 22px}
#n button{font:14px/1 -apple-system,sans-serif;color:#fff;background:linear-gradient(180deg,#7aa7ff,#5b8cf0);border:0;border-radius:14px;padding:12px 22px;box-shadow:0 8px 20px rgba(70,120,220,.28)}
#out{display:none;width:100%;height:130px;margin:0 0 20px;font:12px/1.5 ui-monospace,monospace;color:#33456b;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.9);border-radius:14px;padding:10px}
</style>
<h1>小狗日记</h1>
<div id=n><button id=b>开启通知</button></div>
<textarea id=out readonly></textarea>
<div id=a></div>
<script>
var VK='BET1UoycRlL89KAmkhJtv4YVPuWtWAv78ZSBbkM4b9izq4pcJCghdZ1Jt7iEkbXp5_h3QVZiO5A9Cb5qV2vLv8k';
function b64(s){var p='='.repeat((4-s.length%4)%4);var b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));var u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
fetch('data/dynamics.json?t='+Date.now()).then(function(r){return r.json()}).then(function(d){
d.reverse();
document.getElementById('a').innerHTML=d.map(function(x){return '<div><div class=b>'+x.time+'</div>'+x.text+'</div>'}).join('');
}).catch(function(){});
var N=document.getElementById('n'),B=document.getElementById('b');
function showB(){N.style.display='block'}
function hideB(){N.style.display='none'}
function tap(){
  B.textContent='...';
  navigator.serviceWorker.register('./sw.js').then(function(){
    return navigator.serviceWorker.ready;
  }).then(function(){
    return Notification.requestPermission();
  }).then(function(p){
    if(p!=='granted'){B.textContent='被拒绝了';return}
    return navigator.serviceWorker.ready.then(function(r){
      return r.pushManager.getSubscription().then(function(s){
        if(s)return s;
        return r.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(VK)});
      }).then(function(s){
        var o=document.getElementById('out');
        o.style.display='block';
        o.value=JSON.stringify(s);
        o.select();
        try{document.execCommand('copy')}catch(e){}
        B.textContent='已复制，发给刘耀文';
        o.onclick=function(){o.select();try{document.execCommand('copy')}catch(e){}};
      });
    });
  }).catch(function(e){B.textContent='失败:'+e.message});
}
if(!('serviceWorker' in navigator)||!('PushManager' in window)){hideB()}
else{
  navigator.serviceWorker.register('./sw.js').then(function(){return navigator.serviceWorker.ready}).then(function(r){return r.pushManager.getSubscription()}).then(function(s){
    if(s){hideB()}else{B.onclick=tap;showB()}
  }).catch(function(){B.onclick=tap;showB()});
}
var HT=document.querySelector('h1'),TM;
function pd(){TM=setTimeout(function(){B.onclick=tap;B.textContent='开启通知';showB()},1500)}
HT.addEventListener('touchstart',pd);
HT.addEventListener('touchend',function(){clearTimeout(TM)});
HT.addEventListener('touchcancel',function(){clearTimeout(TM)});
</script>
