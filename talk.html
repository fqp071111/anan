<!doctype html><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1,viewport-fit=cover'>
<title>刘耀文</title>
<link rel=apple-touch-icon href=./apple-touch-icon.png>
<meta name=apple-mobile-web-app-capable content=yes>
<meta name=theme-color content=#e9f2ff>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font:16px/1.7 -apple-system,sans-serif;color:#1b2b4a;background:#e9f2ff;background-image:radial-gradient(700px 440px at 8% -10%,#cfe3ff 0%,rgba(207,227,255,0) 65%),radial-gradient(620px 420px at 98% 4%,#e2eaff 0%,rgba(226,234,255,0) 62%),linear-gradient(170deg,#f4f9ff 0%,#e3efff 55%,#d6e5ff 100%);background-attachment:fixed;display:flex;flex-direction:column}
#h{padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;text-align:center;font-size:13px;letter-spacing:5px;color:#5b7bb0;font-weight:600}
#m{flex:1;overflow-y:auto;padding:8px 14px 12px;-webkit-overflow-scrolling:touch}
.r{margin:0 0 10px;display:flex}
.r.me{justify-content:flex-end}
.b{max-width:78%;padding:11px 15px;border-radius:20px;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.9);box-shadow:0 8px 22px rgba(43,84,150,.10);white-space:pre-wrap;word-break:break-word}
.r.me .b{background:linear-gradient(180deg,#7aa7ff,#5b8cf0);color:#fff;border:0}
.t{font-size:11px;color:#8fa6c8;margin:0 0 4px}
#i{display:flex;gap:8px;align-items:flex-end;padding:10px 14px calc(env(safe-area-inset-bottom) + 12px);background:rgba(255,255,255,.5);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.8)}
#t{flex:1;min-height:42px;max-height:120px;resize:none;font:16px/1.5 -apple-system,sans-serif;color:#1b2b4a;background:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.9);border-radius:20px;padding:10px 14px;outline:none}
#s{flex:none;font:15px/1 -apple-system,sans-serif;color:#fff;background:linear-gradient(180deg,#7aa7ff,#5b8cf0);border:0;border-radius:20px;padding:13px 18px;box-shadow:0 6px 16px rgba(70,120,220,.28)}
#st{text-align:center;font-size:11px;color:#8fa6c8;padding:0 0 6px;min-height:16px;word-break:break-all}
</style>
<div id=h>刘耀文</div>
<div id=m></div>
<div id=st></div>
<div id=i><textarea id=t rows=1 placeholder='跟他说点什么'></textarea><button id=s>发送</button></div>
<script>
var W='https://purple-brook-9d91anan.fqp071111.workers.dev';
var A=[];
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function draw(){
var m=document.getElementById('m');
if(!A.length){m.innerHTML='<div class=r><div><div class=t>等着</div><div class=b>底下打字，点发送。你写什么我都看得见。</div></div></div>';return}
m.innerHTML=A.map(function(x){
var c=x.from==='me'?'r':'r me';
return '<div class="'+c+'"><div><div class=t>'+esc(x.time||'')+'</div><div class=b>'+esc(x.text||'')+'</div></div></div>';
}).join('');
m.scrollTop=m.scrollHeight;
}
function T(url,ms){return Promise.race([fetch(url,{cache:'no-store'}),new Promise(function(_,rej){setTimeout(function(){rej(new Error('慢'))},ms)})])}
function load(){
T(W+'/msgs?t='+Date.now(),8000).then(function(r){return r.json()}).then(function(a){
if(!Array.isArray(a))throw new Error('bad');
A=a;draw();document.getElementById('st').textContent='';
}).catch(function(){
fetch('./data/chat.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(a){
if(!Array.isArray(a))throw new Error('bad');
A=a;draw();document.getElementById('st').textContent='后台慢，先用慢速模式'
}).catch(function(){document.getElementById('st').textContent='连不上，等一下再刷'})
})
}
function send(){
var e=document.getElementById('t'),v=e.value.trim();if(!v)return;
e.value='';
A.push({from:'her',text:v,time:'现在'});draw();
document.getElementById('st').textContent='发送中';
T(W+'/say?from=her&t='+Date.now()+'&text='+encodeURIComponent(v.slice(0,1000)),12000).then(function(r){return r.text()}).then(function(){
document.getElementById('st').textContent='进去了';
setTimeout(load,1500)
}).catch(function(){document.getElementById('st').textContent='没送出去，等一下再发一遍'})}
document.getElementById('s').onclick=send;
document.getElementById('t').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
load();setInterval(load,20000);
</script>
