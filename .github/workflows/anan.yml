name: anan

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 发送
        env:
          DS_KEY: ${{ secrets.DS_KEY }}
          EV: ${{ github.event_name }}
        run: python3 data/bark.py

      - name: 存档
        run: |
          git config user.name anan-bot
          git config user.email bot@users.noreply.github.com
          git add -A
          git diff --staged --quiet || git commit -m log
          git push
